services:
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8080"
    volumes:
      - ./src:/var/www/html/src
      - ./public:/var/www/html/public
      - ./migrations:/var/www/html/migrations
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_NAME: blog_db
      DB_USER: blog_user
      DB_PASS: blog_pass
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  db_data:
