name: Blog CI

on:
  pull_request:
    paths:
      - 'apps/blog/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blog-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/blog/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blog-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace blog
      - run: npm run lint --workspace blog
      - run: npm run test --workspace blog
      - run: npm run build --workspace blog
      - run: npm audit --workspace blog --omit=dev --audit-level=high
